<svg xmlns="http://www.w3.org/2000/svg" width="660" height="352" viewBox="0 0 660 352" role="img" aria-label="TallyPad calculating an invoice: expressions on the left, live results on the right">
  <defs>
    <clipPath id="win">
      <rect x="20" y="16" width="620" height="316" rx="12"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="20" y="16" width="620" height="316" rx="12" fill="#1e1e24" filter="url(#shadow)"/>

  <g clip-path="url(#win)">
    <rect x="20" y="16" width="620" height="36" fill="#26262e"/>
    <rect x="460" y="52" width="180" height="280" fill="#26262e"/>
    <line x1="20" y1="52" x2="640" y2="52" stroke="#33333d" stroke-width="1"/>
    <line x1="460" y1="52" x2="460" y2="332" stroke="#33333d" stroke-width="1"/>
  </g>

  <text x="616" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6f6f7c">october-invoice.txt</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16">
    <text x="44" y="82" xml:space="preserve"><tspan fill="#6f6f7c" font-style="italic"># October invoice</tspan></text>
    <text x="44" y="108" xml:space="preserve"><tspan fill="#82aaff">design</tspan><tspan fill="#e6e6ea">    </tspan><tspan fill="#9a9aa8">=</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#7fd88f">$2,400</tspan></text>
    <text x="44" y="134" xml:space="preserve"><tspan fill="#82aaff">build</tspan><tspan fill="#e6e6ea">     </tspan><tspan fill="#9a9aa8">=</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#7fd88f">$6,800</tspan></text>
    <text x="44" y="160" xml:space="preserve"><tspan fill="#82aaff">revisions</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#9a9aa8">=</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#7fd88f">$950</tspan></text>
    <text x="44" y="186" xml:space="preserve"><tspan fill="#82aaff">subtotal</tspan><tspan fill="#e6e6ea">  </tspan><tspan fill="#9a9aa8">=</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#82aaff">design</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#9a9aa8">+</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#82aaff">build</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#9a9aa8">+</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#82aaff">revisions</tspan></text>
    <text x="44" y="238" xml:space="preserve"><tspan fill="#82aaff">tax</tspan><tspan fill="#e6e6ea">   </tspan><tspan fill="#9a9aa8">=</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#7fd88f">8.5</tspan><tspan fill="#9a9aa8">%</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#e0a060">of</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#82aaff">subtotal</tspan></text>
    <text x="44" y="264" xml:space="preserve"><tspan fill="#82aaff">total</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#9a9aa8">=</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#82aaff">subtotal</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#9a9aa8">+</tspan><tspan fill="#e6e6ea"> </tspan><tspan fill="#82aaff">tax</tspan></text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16">
    <text x="616" y="108" text-anchor="end" fill="#8fd3a4">$2,400.00</text>
    <text x="616" y="134" text-anchor="end" fill="#8fd3a4">$6,800.00</text>
    <text x="616" y="160" text-anchor="end" fill="#8fd3a4">$950.00</text>
    <text x="616" y="186" text-anchor="end" fill="#8fd3a4">$10,150.00</text>
    <text x="616" y="238" text-anchor="end" fill="#8fd3a4">$862.75</text>
    <text x="616" y="264" text-anchor="end" fill="#8fd3a4">$11,012.75</text>
  </g>

  <rect x="44" y="277" width="2" height="18" fill="#e6e6ea" opacity="0.8"/>

  <rect x="20" y="16" width="620" height="316" rx="12" fill="none" stroke="#33333d" stroke-width="1"/>
</svg>
